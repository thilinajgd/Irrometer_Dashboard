<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Moisture & Temperature Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
        /* Custom font */
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-900 mb-2">
                Smart Irrigation Monitor
            </h1>
            <p id="system-status" class="text-gray-600 text-sm">
                Status: <span class="font-semibold text-red-500">Initializing...</span>
            </p>
        </header>

        <!-- Metric Cards -->
        <div id="metric-cards" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Resistance Card -->
            <div id="resistance-card" class="card-metric bg-white p-6 rounded-xl shadow-lg transition-shadow duration-300 hover:shadow-xl border-t-4 border-yellow-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Resistance</h2>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div class="text-5xl font-bold text-gray-900 mb-2">
                    <span id="display-ohms">---</span>
                    <span class="text-xl font-normal text-gray-500">Ohms</span>
                </div>
                <p id="update-ohms" class="text-xs text-gray-500 pt-2 border-t mt-4">Last updated: N/A</p>
            </div>

            <!-- Temperature Card -->
            <div id="temperature-card" class="card-metric bg-white p-6 rounded-xl shadow-lg transition-shadow duration-300 hover:shadow-xl border-t-4 border-red-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Temperature</h2>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 10a4 4 0 01-4 4v7a1 1 0 01-1 1H5a1 1 0 01-1-1v-7a4 4 0 01-4-4v-1a1 1 0 011-1h3a1 1 0 011 1v1h-1v1a2 2 0 002 2h4a2 2 0 002-2v-1h-1v-1a1 1 0 011-1h3a1 1 0 011 1v1a4 4 0 01-4 4z" />
                        <path d="M12 18V3" />
                    </svg>
                </div>
                <div class="text-5xl font-bold text-gray-900 mb-2">
                    <span id="display-temp">---</span>
                    <span class="text-xl font-normal text-gray-500">°C</span>
                </div>
                <p id="update-temp" class="text-xs text-gray-500 pt-2 border-t mt-4">Last updated: N/A</p>
            </div>

            <!-- Centibar Card (Soil Water Potential) -->
            <div id="centibar-card" class="card-metric bg-white p-6 rounded-xl shadow-lg transition-shadow duration-300 hover:shadow-xl border-t-4 border-blue-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Soil Water Potential</h2>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10m-8-4l8 4m-8-4l8 4" />
                    </svg>
                </div>
                <div class="text-5xl font-bold text-gray-900 mb-2">
                    <span id="display-centibar">---</span>
                    <span class="text-xl font-normal text-gray-500">cb</span>
                </div>
                <!-- Status Bar -->
                <p id="status-text" class="text-sm font-medium text-blue-600 my-1">Status: N/A</p>
                <p id="update-centibar" class="text-xs text-gray-500 pt-2 border-t mt-4">Last updated: N/A</p>
            </div>
        </div>

        <!-- Centibar History Chart -->
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold text-blue-900 mb-4">Centibar Trend (Last 24 Readings)</h2>
            <div class="relative h-96">
                <canvas id="centibarChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Firebase and Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD72NRZtJ5s_1Trv1jBbISvz80ni1uwne0",
            authDomain: "irrometer-watermark-sensor.firebaseapp.com",
            databaseURL: "https://irrometer-watermark-sensor-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "irrometer-watermark-sensor",
            storageBucket: "irrometer-watermark-sensor.firebasestorage.app",
            messagingSenderId: "81648679067",
            appId: "1:81648679067:web:1f473773a7a914f24fae3e",
            measurementId: "G-JJ6HL1NGMF"
        };


        // Check if configuration is available
        if (!firebaseConfig || !firebaseConfig.databaseURL) {
            document.getElementById('system-status').innerHTML = 'Status: <span class="font-semibold text-red-500">Firebase configuration missing.</span>';
            document.getElementById('metric-cards').innerHTML = '<p class="text-center col-span-3 text-red-500">Cannot load data: Firebase configuration is missing.</p>';
            throw new Error("Firebase configuration is required.");
        }

        // 2. INITIALIZE FIREBASE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        setLogLevel('Debug'); // Enable debug logging for Firebase

        let centibarChart; // Chart instance

        const formatTimeForChart = (timestamp) => {
            if (!timestamp) return 'N/A';
            // Example: 2024-05-15 10:30:00 -> 10:30 (15/05)
            const parts = timestamp.split(' ');
            if (parts.length === 2) {
                const time = parts[1].substring(0, 5); // HH:MM
                const dateParts = parts[0].split('-');
                if (dateParts.length === 3) {
                     // MM/DD format
                    return `${time} (${dateParts[1]}/${dateParts[2]})`;
                }
                return time;
            }
            return timestamp;
        };

        // 3. AUTHENTICATION AND DATA LISTENERS
        async function initializeAppAndAuth() {
            try {
                // We use anonymous sign-in as the simplest way to authenticate
                // for read access to the Realtime Database.
                await signInAnonymously(auth);
                
                document.getElementById('system-status').innerHTML = 'Status: <span class="font-semibold text-green-600">Connected & Authenticated</span>';
                
                // Start listening for data once authenticated
                listenForCurrentData();
                listenForHistoricalData();

            } catch (error) {
                console.error("Firebase Auth Error: Ensure your Realtime Database Security Rules allow anonymous read access or implement a proper login.", error);
                document.getElementById('system-status').innerHTML = 'Status: <span class="font-semibold text-red-500">Authentication Failed. Check Database Rules.</span>';
            }
        }

        // 4. LISTEN FOR CURRENT DATA (LATEST VALUES)
        function listenForCurrentData() {
            // Note: Data path matches the Arduino sketch: /watermark_sensor
            const currentDataRef = ref(db, 'watermark_sensor/');
            
            onValue(currentDataRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    // Update Resistance Card
                    document.getElementById('display-ohms').textContent = data.resistance_Ohms !== undefined ? data.resistance_Ohms.toFixed(0) : '---';
                    document.getElementById('update-ohms').textContent = `Last updated: ${data.timestamp || 'N/A'}`;

                    // Update Temperature Card
                    document.getElementById('display-temp').textContent = data.temperature_C !== undefined ? data.temperature_C.toFixed(2) : '---';
                    document.getElementById('update-temp').textContent = `Last updated: ${data.timestamp || 'N/A'}`;

                    // Update Centibar Card
                    document.getElementById('display-centibar').textContent = data.centibar !== undefined ? data.centibar.toFixed(2) : '---';
                    document.getElementById('update-centibar').textContent = `Last updated: ${data.timestamp || 'N/A'}`;
                    
                    // Update Status Text and styling
                    const statusEl = document.getElementById('status-text');
                    statusEl.textContent = `Status: ${data.status || 'N/A'}`;
                    
                    // Simple logic to change color based on soil status (Centibar ranges from Arduino code)
                    let statusColor = 'text-gray-600';
                    if (data.centibar >= 0 && data.centibar <= 10) { // Wet
                        statusColor = 'text-sky-600';
                    } else if (data.centibar > 10 && data.centibar <= 30) { // Ideal
                        statusColor = 'text-green-600';
                    } else if (data.centibar > 30 && data.centibar <= 200) { // Dry
                        statusColor = 'text-red-600';
                    }
                    statusEl.className = `text-sm font-medium my-1 ${statusColor}`;

                } else {
                    console.warn("No current data found at /watermark_sensor/");
                }
            }, {
                // Handle potential errors in reading data
                onlyOnce: false 
            });
        }


        // 5. LISTEN FOR HISTORICAL DATA (FOR CHART)
        function listenForHistoricalData() {
            // Query the last 24 entries (approximately 24 hours if running every minute)
            const historyRef = query(ref(db, 'watermark_sensor/history'), limitToLast(24));

            onValue(historyRef, (snapshot) => {
                const historyData = snapshot.val();
                if (historyData) {
                    const timestamps = [];
                    const centibars = [];

                    // Sort entries by timestamp field
                    const sortedEntries = Object.values(historyData)
                        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                    sortedEntries.forEach(entry => {
                        timestamps.push(formatTimeForChart(entry.timestamp));
                        centibars.push(entry.centibar);
                    });

                    updateChart(timestamps, centibars);

                } else {
                    console.warn("No historical data found.");
                    updateChart([], []); // Clear chart if no history
                }
            });
        }

        // 6. CHART INITIALIZATION AND UPDATE
        function updateChart(labels, data) {
            const ctx = document.getElementById('centibarChart').getContext('2d');

            if (centibarChart) {
                // Update existing chart
                centibarChart.data.labels = labels;
                centibarChart.data.datasets[0].data = data;
                centibarChart.update();
            } else {
                // Initialize new chart
                centibarChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Soil Water Potential (Centibar)',
                            data: data,
                            borderColor: '#3b82f6', // blue-500
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 3,
                            pointBackgroundColor: '#1d4ed8' // blue-700
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    color: '#1f2937' // gray-800
                                }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Centibar (cb)',
                                    color: '#4b5563'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Time',
                                    color: '#4b5563'
                                }
                            }
                        }
                    }
                });
            }
        }

        // Start the application flow
        initializeAppAndAuth();
    </script>
</body>
</html>
